spring.application.name=grocery-backend
server.port=8080
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,text/plain,text/html,text/xml,application/xml,application/javascript,text/css

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/grocerydb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.default-property-inclusion=non_null
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

app.jwt.access-secret=${JWT_ACCESS_SECRET:dev_access_secret_change_me_12345678901234567890}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:dev_refresh_secret_change_me_12345678901234567890}
app.jwt.access-ttl=PT15M
app.jwt.refresh-ttl=P7D
app.bcrypt-salt-rounds=${BCRYPT_SALT_ROUNDS:12}
app.cors-whitelist=${CORS_WHITELIST:http://localhost:4200}
app.default-delivery-fee=${DEFAULT_DELIVERY_FEE:40}
app.free-delivery-threshold=${FREE_DELIVERY_THRESHOLD:499}
app.tax-percent=${TAX_PERCENT:5}
app.low-stock-default-threshold=${LOW_STOCK_DEFAULT_THRESHOLD:10}
app.payment-provider=${PAYMENT_PROVIDER:MOCK}
app.payment-webhook-secret=${PAYMENT_WEBHOOK_SECRET:}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:4200}
app.ai.enabled=${AI_ENABLED:false}
app.ai.provider=${AI_PROVIDER:OPENAI}
app.ai.api-key=${AI_API_KEY:}
app.ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
app.ai.model=${AI_MODEL:gpt-4o-mini}
app.ai.timeout=${AI_TIMEOUT:PT20S}

management.endpoints.web.exposure.include=health,info
